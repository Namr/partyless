<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Partyless</title>

  <!-- (Optional) Bootstrap for base resets & grid; we’ll override styles -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"/>
  <link href="styles.css" rel="stylesheet"/>
  <script src="https://cdn.jsdelivr.net/npm/htmx.org@2.0.8/dist/htmx.min.js"></script>
</head>

<body>
  <div class="shell">
    <header>
      <div class="brand">
        <h1><a href="/">Partyless</a></h1>
      </div>
      <div class="tag">RSVPs without the BS</div>
    </header>

    <main>
      <form id="password-form" style="display: none;">
        <input type="hidden" name="password" id="stored-password-field" />
      </form>

      <div class="card auth-card" id="auth-card">
        <form id="auth-form" hx-post="/auth_guest" hx-target="#auth-card" hx-swap="innerHTML">
          <h2 class="auth-title">Edit Your RSVP</h2>
          <input type="hidden" name="guest_id" id="guest-id-field" />
          <div class="group">
            <label for="password">Password</label>
            <input
              type="password"
              class="form-control auth-input"
              id="password"
              name="password"
              required
              autocomplete="current-password"
              placeholder="Enter your RSVP password"
            />
          </div>
          <button type="submit" class="btn btn-primary auth-btn">Submit</button>
          <div id="error-modal-container"></div>
        </form>
      </div>
    </main>
  </div>

  <script>
    document.body.addEventListener("htmx:responseError", function(evt) {
      let target = document.querySelector("#error-modal-container");
      htmx.swap(target, evt.detail.xhr.responseText, "innerHTML");
    });

    // Capture password before auth form is submitted
    document.body.addEventListener("htmx:configRequest", function(evt) {
      if (evt.detail.path === '/auth_guest') {
        const passwordField = document.getElementById('password');
        const storedPasswordField = document.getElementById('stored-password-field');
        if (passwordField && storedPasswordField) {
          storedPasswordField.value = passwordField.value;
        }
      }
    });

    (function () {
      const params = new URLSearchParams(window.location.search);
      const guestId = params.get('guest_id') || '';
      const guestIdField = document.getElementById('guest-id-field');
      if (guestIdField) {
        guestIdField.value = guestId;
      }
    })();
  </script>
</body>
</html>
