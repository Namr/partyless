<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Partyless</title>

  <!-- (Optional) Bootstrap for base resets & grid; we’ll override styles -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"/>
  <link href="styles.css" rel="stylesheet"/>
  <script src="https://cdn.jsdelivr.net/npm/htmx.org@2.0.8/dist/htmx.min.js"></script>
</head>

<body>
  <div class="shell">
    <header>
      <div class="brand">
        <h1><a href="/">Partyless</a></h1>
      </div>
      <div class="tag">RSVPs without the BS</div>
    </header>

    <main>
      <div class="card">
        <form hx-post="/event" hx-on::after-request="this.reset()">
          <div class="group">
            <label for="password">
              Password
              <span class="label-hint">(optional, 5-24 chars)</span>
            </label>
            <input
              type="password"
              class="form-control"
              id="password"
              name="password"
              minlength="5"
              maxlength="24"
              autocomplete="new-password"
              placeholder="Leave blank to skip"
            />
          </div>
        </form>
      </div>
    </main>
  </div>

  <script>
    document.body.addEventListener("htmx:responseError", function(evt) {
      let target = document.querySelector("#error-modal-container");
      htmx.swap(target, evt.detail.xhr.responseText, "innerHTML");
    });
  </script>
</body>
</html>
